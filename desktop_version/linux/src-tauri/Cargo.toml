[package]
name = "steam-calendar-desktop"
version = "1.0.6"
description = "Linux desktop wrapper for Steam Calendar"
authors = ["Steam Calendar"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
