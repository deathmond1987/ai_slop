services:
  app:
    build:
      context: .
      args:
        STEAM_CALENDAR_VERSION: "${STEAM_CALENDAR_VERSION:-}"
    image: steam-calendar:latest
    restart: unless-stopped
    init: true
    ports:
      - "${PORT:-5000}:3000"
    environment:
      STEAM_CALENDAR_VERSION: "${STEAM_CALENDAR_VERSION:-}"
      AUTH_BASE_URL: "${AUTH_BASE_URL:-http://localhost:5000}"
      APP_DEBUG: "${APP_DEBUG:-1}"
      COOKIE_SECURE: "${COOKIE_SECURE:-}"
      DB_SQLITE_PATH: "/app/data/steam-calendar.sqlite"
      SESSION_PASSWORD: "${SESSION_PASSWORD:-}"
      DB_ENCRYPTION_KEY: "${DB_ENCRYPTION_KEY:-}"
      RAWG_API_KEY: "${RAWG_API_KEY:-}"
      STEAM_API_KEY: "${STEAM_API_KEY:-}"
      UPCOMING_CACHE_TTL_MS: "${UPCOMING_CACHE_TTL_MS:-}"
      STEAM_FETCH_TIMEOUT_MS: "${STEAM_FETCH_TIMEOUT_MS:-}"
      STEAM_APPDETAILS_TIMEOUT_MS: "${STEAM_APPDETAILS_TIMEOUT_MS:-}"
      STEAM_APPDETAILS_FALLBACK_TIMEOUT_MS: "${STEAM_APPDETAILS_FALLBACK_TIMEOUT_MS:-}"
      STEAM_APPDETAILS_FALLBACK: "${STEAM_APPDETAILS_FALLBACK:-}"
      STEAM_APPDETAILS_CONCURRENCY: "${STEAM_APPDETAILS_CONCURRENCY:-}"
      STEAM_APPDETAILS_MIN_INTERVAL_MS: "${STEAM_APPDETAILS_MIN_INTERVAL_MS:-}"
      STEAM_APPDETAILS_RETRY: "${STEAM_APPDETAILS_RETRY:-}"
      STEAM_APPDETAILS_RETRY_DELAY_MS: "${STEAM_APPDETAILS_RETRY_DELAY_MS:-}"
      STEAM_APPDETAILS_RETRY_MAX_ATTEMPTS: "${STEAM_APPDETAILS_RETRY_MAX_ATTEMPTS:-}"
      STEAM_APPDETAILS_RETRY_QUEUE_MAX: "${STEAM_APPDETAILS_RETRY_QUEUE_MAX:-}"
      STEAM_APPDETAILS_RETRY_STEAM_IDS_MAX: "${STEAM_APPDETAILS_RETRY_STEAM_IDS_MAX:-}"
      WISHLIST_FETCH_TIMEOUT_MS: "${WISHLIST_FETCH_TIMEOUT_MS:-}"
      WISHLIST_PAGE_FALLBACK_ENABLED: "${WISHLIST_PAGE_FALLBACK_ENABLED:-}"
      EARLY_ACCESS_SEARCH_DELAY_MS: "${EARLY_ACCESS_SEARCH_DELAY_MS:-600}"
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  app_data:
