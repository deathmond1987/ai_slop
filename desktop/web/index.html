<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Steam Calendar</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b1020;
        color: #e7edf8;
      }

      main {
        width: min(620px, calc(100vw - 32px));
        padding: 34px;
        border: 1px solid rgba(231, 237, 248, 0.16);
        border-radius: 20px;
        background: rgba(17, 24, 39, 0.86);
        box-shadow: 0 22px 70px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0 0 16px;
        font-size: 28px;
      }

      p {
        margin: 0;
        line-height: 1.55;
        color: #b8c2d0;
      }

      .launcher {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 28px;
      }

      .launcher-copy {
        flex: 1 1 auto;
        min-width: 0;
      }

      .status {
        color: #dce7ff;
        font-size: 20px;
        line-height: 1.4;
      }

      button {
        appearance: none;
        margin-top: 22px;
        border: 1px solid rgba(47, 129, 247, 0.45);
        border-radius: 12px;
        padding: 10px 14px;
        background: #2f81f7;
        color: #ffffff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button[hidden] {
        display: none;
      }

      .launcher-spinner {
        position: relative;
        width: 78px;
        height: 78px;
        border-radius: 50%;
        border: 5px solid rgba(47, 129, 247, 0.16);
        border-top-color: #2f81f7;
        animation: launch-spin 900ms linear infinite;
      }

      .launcher-spinner-core {
        position: absolute;
        inset: 19px;
        border-radius: 50%;
        background: #2f81f7;
        animation: launch-pulse 1.6s ease-in-out infinite;
      }

      body[data-state="error"] .launcher-spinner {
        border-color: rgba(220, 38, 38, 0.22);
        border-top-color: #dc2626;
        animation: none;
      }

      body[data-state="error"] .launcher-spinner-core {
        background: #dc2626;
        animation: none;
      }

      @keyframes launch-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes launch-pulse {
        0%,
        100% {
          transform: scale(0.68);
          opacity: 0.45;
        }

        50% {
          transform: scale(1);
          opacity: 0.9;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .launcher-spinner,
        .launcher-spinner-core {
          animation: none;
        }
      }
    </style>
  </head>
  <body data-state="launching">
    <main>
      <h1>Steam Calendar</h1>
      <div class="launcher">
        <div class="launcher-copy">
          <p class="status" id="status" aria-live="polite">Application is launching...</p>
          <button id="restart" type="button" hidden>Restart</button>
        </div>
        <div class="launcher-spinner" aria-hidden="true">
          <span class="launcher-spinner-core"></span>
        </div>
      </div>
    </main>

    <script>
      const statusEl = document.getElementById("status");
      const restartBtn = document.getElementById("restart");
      const labels = {
        en: {
          launching: "Application is launching...",
          restart: "Restart",
          unavailable: "Desktop mode is unavailable.",
          failed: "Application failed to launch.",
          timedOut: "Application did not launch in time.",
          restartFailed: "Restart failed.",
        },
        ru: {
          launching: "Приложение запускается...",
          restart: "Перезапустить",
          unavailable: "Настольный режим недоступен.",
          failed: "Не удалось запустить приложение.",
          timedOut: "Приложение не запустилось вовремя.",
          restartFailed: "Не удалось перезапустить.",
        },
      };
      const lang = (navigator.language || "en").toLowerCase().startsWith("ru") ? "ru" : "en";
      const text = labels[lang];

      statusEl.textContent = text.launching;
      restartBtn.textContent = text.restart;

      let isPolling = false;

      function showLaunching() {
        document.body.dataset.state = "launching";
        statusEl.textContent = text.launching;
        restartBtn.hidden = true;
      }

      function showError(message, detail) {
        document.body.dataset.state = "error";
        statusEl.textContent = message;
        if (detail) console.error(detail);
        restartBtn.hidden = false;
      }

      async function restartSidecar() {
        restartBtn.disabled = true;
        showLaunching();

        try {
          await window.__TAURI__.core.invoke("restart_sidecar");
          restartBtn.disabled = false;
          pollSidecar();
        } catch (error) {
          restartBtn.disabled = false;
          showError(text.restartFailed, error);
        }
      }

      restartBtn.addEventListener("click", restartSidecar);

      async function pollSidecar() {
        if (!window.__TAURI__?.core?.invoke) {
          showError(text.unavailable);
          return;
        }

        if (isPolling) return;

        isPolling = true;
        showLaunching();

        for (let attempt = 0; attempt < 120; attempt += 1) {
          try {
            const status = await window.__TAURI__.core.invoke("sidecar_status");

            if (status.status === "ready") {
              window.location.replace("http://127.0.0.1:" + status.port + "/");
              return;
            }

            if (status.status === "failed" || status.status === "exited") {
              showError(text.failed, status.log_path);
              isPolling = false;
              return;
            }

            if (status.status === "idle") console.debug(status);
          } catch (error) {
            showError(text.failed, error);
            isPolling = false;
            return;
          }

          await new Promise((resolve) => setTimeout(resolve, 250));
        }

        showError(text.timedOut);
        isPolling = false;
      }

      pollSidecar();
    </script>
  </body>
</html>
